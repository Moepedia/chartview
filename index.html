<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebolus Terminal — Professional Trading</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind v3 (STABIL) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <!-- Lightweight Charts v4 (STABIL) -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        #chart-container { position: relative; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div class="h-screen grid" style="grid-template-rows: 48px 1fr 24px;">
    
    <!-- HEADER -->
    <header class="bg-[#161b22] border-b border-[#30363d] flex items-center px-4 gap-3">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-[#00d4ff] rounded flex items-center justify-center">
                <i data-lucide="trending-up" class="w-4 h-4 text-[#0d1117]"></i>
            </div>
            <span class="font-semibold text-[#f0f6fc] text-sm">Nebolus</span>
        </div>
        
        <div class="w-px h-6 bg-[#30363d]"></div>
        
        <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#8b949e] z-10"></i>
            <input type="text" id="symbolSearch" placeholder="Search symbol..." autocomplete="off"
                class="w-64 bg-[#0d1117] border border-[#30363d] rounded-md pl-9 pr-3 py-1.5 text-sm text-[#f0f6fc] placeholder-[#8b949e] focus:outline-none focus:border-[#00d4ff]">
            <div id="searchDropdown" class="hidden absolute top-full left-0 right-0 mt-1 bg-[#161b22] border border-[#30363d] rounded-md shadow-xl z-50 max-h-80 overflow-y-auto"></div>
        </div>
        
        <div class="flex items-center gap-0.5 bg-[#0d1117] rounded-md p-1 border border-[#30363d]">
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="1">1m</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="5">5m</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="15">15m</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="60">1H</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#f0f6fc] bg-[#00d4ff]/20 border border-[#00d4ff]/30" data-tf="240">4H</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="D">1D</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="W">1W</button>
        </div>
        
        <div class="flex items-center gap-0.5 bg-[#0d1117] rounded-md p-1 border border-[#30363d]">
            <button class="chart-type-btn p-1.5 rounded bg-[#21262d] text-[#00d4ff]" data-type="candlestick">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
            </button>
            <button class="chart-type-btn p-1.5 rounded text-[#8b949e] hover:text-[#f0f6fc]" data-type="line">
                <i data-lucide="line-chart" class="w-4 h-4"></i>
            </button>
            <button class="chart-type-btn p-1.5 rounded text-[#8b949e] hover:text-[#f0f6fc]" data-type="area">
                <i data-lucide="area-chart" class="w-4 h-4"></i>
            </button>
        </div>
        
        <div class="flex-1"></div>
        
        <button class="p-2 rounded-md hover:bg-[#21262d]"><i data-lucide="git-compare" class="w-4 h-4 text-[#8b949e]"></i></button>
        <button class="p-2 rounded-md hover:bg-[#21262d]"><i data-lucide="bell" class="w-4 h-4 text-[#8b949e]"></i></button>
        <button class="p-2 rounded-md hover:bg-[#21262d]"><i data-lucide="settings" class="w-4 h-4 text-[#8b949e]"></i></button>
    </header>
    
    <!-- MAIN -->
    <div class="grid overflow-hidden" style="grid-template-columns: 48px 1fr 300px;">
        
        <aside class="bg-[#161b22] border-r border-[#30363d] flex flex-col items-center py-2 gap-1">
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md bg-[#00d4ff]/20 text-[#00d4ff]" data-tool="cursor"><i data-lucide="mouse-pointer-2" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="trendline"><i data-lucide="trending-up" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="horizontal"><i data-lucide="minus" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="fibonacci"><i data-lucide="git-branch" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="rectangle"><i data-lucide="square" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="text"><i data-lucide="type" class="w-4 h-4"></i></button>
            <div class="w-6 h-px bg-[#30363d] my-2"></div>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="measure"><i data-lucide="ruler" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="zoom"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
        </aside>
        
        <main class="relative bg-[#0d1117]">
            <div id="chart-container"></div>
            
            <div class="absolute top-4 left-4 bg-[#161b22]/90 border border-[#30363d] rounded-lg px-3 py-2 flex items-center gap-4 z-10" style="backdrop-filter: blur(8px);">
                <div class="flex items-center gap-2">
                    <span class="text-[#f0f6fc] font-semibold text-sm" id="legendSymbol">BTCUSD</span>
                    <span class="text-[#8b949e] text-xs">·</span>
                    <span class="text-[#8b949e] text-xs" id="legendTimeframe">4H</span>
                </div>
                <div class="flex items-center gap-3 text-xs font-mono">
                    <span class="text-[#8b949e]">O <span id="legendOpen" class="text-[#3fb950]">-</span></span>
                    <span class="text-[#8b949e]">H <span id="legendHigh" class="text-[#3fb950]">-</span></span>
                    <span class="text-[#8b949e]">L <span id="legendLow" class="text-[#f85149]">-</span></span>
                    <span class="text-[#8b949e]">C <span id="legendClose" class="text-[#3fb950]">-</span></span>
                </div>
            </div>
            
            <div class="absolute top-4 right-4 bg-[#161b22]/90 border border-[#30363d] rounded-lg px-3 py-2 z-10" style="backdrop-filter: blur(8px);">
                <div class="text-xs text-[#8b949e] mb-1">Price</div>
                <div class="text-lg font-mono font-semibold" id="currentPrice">-</div>
                <div class="text-xs font-mono" id="priceChange">-</div>
            </div>
        </main>
        
        <aside class="bg-[#161b22] border-l border-[#30363d] overflow-y-auto">
            <div class="border-b border-[#30363d]">
                <div class="flex items-center justify-between px-3 py-2">
                    <span class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Indicators</span>
                    <span class="text-xs text-[#8b949e] font-mono" id="indicatorCount">0</span>
                </div>
                <div class="px-2 pb-2 space-y-1" id="indicatorList"></div>
                <div class="px-2 pb-2">
                    <button id="addIndicatorBtn" class="w-full flex items-center justify-center gap-2 py-2 rounded-md border border-dashed border-[#30363d] text-[#8b949e] hover:border-[#00d4ff] hover:text-[#00d4ff] text-xs">
                        <i data-lucide="plus" class="w-3 h-3"></i> Add Indicator
                    </button>
                </div>
            </div>
            
            <div class="border-b border-[#30363d]">
                <div class="flex items-center justify-between px-3 py-2">
                    <span class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Bar Replay</span>
                    <i data-lucide="history" class="w-3 h-3 text-[#8b949e]"></i>
                </div>
                <div class="px-2 pb-2 space-y-2">
                    <div class="grid grid-cols-4 gap-1">
                        <button id="replayStart" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d]"><i data-lucide="play" class="w-4 h-4 text-[#3fb950]"></i></button>
                        <button id="replayPause" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d]"><i data-lucide="pause" class="w-4 h-4 text-[#d29922]"></i></button>
                        <button id="replayStep" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d]"><i data-lucide="skip-forward" class="w-4 h-4 text-[#8b949e]"></i></button>
                        <button id="replayReset" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d]"><i data-lucide="rotate-ccw" class="w-4 h-4 text-[#8b949e]"></i></button>
                    </div>
                    <select id="replaySpeed" class="w-full bg-[#0d1117] border border-[#30363d] rounded-md px-2 py-1.5 text-xs text-[#c9d1d9]">
                        <option value="1">1x Speed</option>
                        <option value="5">5x Speed</option>
                        <option value="10">10x Speed</option>
                    </select>
                    <div class="w-full h-1 bg-[#21262d] rounded-full overflow-hidden">
                        <div class="h-full bg-[#00d4ff] transition-all" id="replayProgress" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
            
            <div class="border-b border-[#30363d]">
                <div class="flex items-center justify-between px-3 py-2">
                    <span class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Watchlist</span>
                    <span class="text-xs text-[#8b949e] font-mono" id="watchlistCount">0</span>
                </div>
                <div class="px-2 pb-2 space-y-0.5" id="watchlistContainer"></div>
            </div>
            
            <div class="p-3">
                <div class="flex items-center gap-2 text-xs mb-3">
                    <div class="w-2 h-2 rounded-full bg-[#3fb950]"></div>
                    <span class="text-[#8b949e]">Market Open</span>
                </div>
                <div class="space-y-1 text-xs">
                    <div class="flex justify-between py-1"><span class="text-[#8b949e]">24h Volume</span><span class="font-mono text-[#c9d1d9]" id="infoVolume">-</span></div>
                    <div class="flex justify-between py-1"><span class="text-[#8b949e]">24h High</span><span class="font-mono text-[#3fb950]" id="infoHigh">-</span></div>
                    <div class="flex justify-between py-1"><span class="text-[#8b949e]">24h Low</span><span class="font-mono text-[#f85149]" id="infoLow">-</span></div>
                    <div class="flex justify-between py-1"><span class="text-[#8b949e]">24h Change</span><span class="font-mono" id="infoChange">-</span></div>
                </div>
            </div>
        </aside>
    </div>
    
    <footer class="bg-[#161b22] border-t border-[#30363d] flex items-center px-4 gap-3 text-xs">
        <div class="flex items-center gap-2">
            <div class="w-1.5 h-1.5 rounded-full bg-[#3fb950]"></div>
            <span class="text-[#8b949e]">Connected</span>
        </div>
        <div class="w-px h-3 bg-[#30363d]"></div>
        <span class="text-[#8b949e]">Latency: <span class="text-[#c9d1d9] font-mono">12ms</span></span>
        <div class="w-px h-3 bg-[#30363d]"></div>
        <span class="text-[#8b949e]">Symbol: <span class="text-[#c9d1d9] font-mono" id="statusSymbol">BTCUSD</span></span>
        <div class="w-px h-3 bg-[#30363d]"></div>
        <span class="text-[#8b949e]">TF: <span class="text-[#c9d1d9] font-mono" id="statusTimeframe">4H</span></span>
        <div class="flex-1"></div>
        <span class="text-[#8b949e]">UTC: <span class="text-[#c9d1d9] font-mono" id="statusTime">--:--:--</span></span>
    </footer>
</div>

<script src="./main.js"></script>
</body>
</html>
