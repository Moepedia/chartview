<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebolus Terminal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <!-- Lightweight Charts v4 - STABIL -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        #chart { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div style="height: 100vh; display: grid; grid-template-rows: 48px 1fr 24px;">
    
    <!-- HEADER -->
    <header class="bg-[#161b22] border-b border-[#30363d] flex items-center px-4 gap-3">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-[#00d4ff] rounded flex items-center justify-center">
                <i data-lucide="trending-up" class="w-4 h-4 text-[#0d1117]"></i>
            </div>
            <span class="font-semibold text-[#f0f6fc] text-sm">Nebolus</span>
        </div>
        
        <div class="w-px h-6 bg-[#30363d]"></div>
        
        <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#8b949e] z-10"></i>
            <input type="text" id="symbolSearch" placeholder="Search symbol..." autocomplete="off"
                class="w-64 bg-[#0d1117] border border-[#30363d] rounded-md pl-9 pr-3 py-1.5 text-sm text-[#f0f6fc] placeholder-[#8b949e] focus:outline-none focus:border-[#00d4ff]">
            <div id="searchDropdown" style="display:none;" class="absolute top-full left-0 right-0 mt-1 bg-[#161b22] border border-[#30363d] rounded-md shadow-xl z-50 max-h-80 overflow-y-auto"></div>
        </div>
        
        <div class="flex items-center gap-0.5 bg-[#0d1117] rounded-md p-1 border border-[#30363d]">
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="1">1m</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="5">5m</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="15">15m</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="60">1H</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#f0f6fc] bg-[#00d4ff]/20 border border-[#00d4ff]/30" data-tf="240">4H</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="D">1D</button>
            <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]" data-tf="W">1W</button>
        </div>
        
        <div class="flex-1"></div>
        
        <button class="p-2 rounded-md hover:bg-[#21262d]"><i data-lucide="git-compare" class="w-4 h-4 text-[#8b949e]"></i></button>
        <button class="p-2 rounded-md hover:bg-[#21262d]"><i data-lucide="bell" class="w-4 h-4 text-[#8b949e]"></i></button>
        <button class="p-2 rounded-md hover:bg-[#21262d]"><i data-lucide="settings" class="w-4 h-4 text-[#8b949e]"></i></button>
    </header>
    
    <!-- MAIN -->
    <div style="display: grid; grid-template-columns: 48px 1fr 300px; overflow: hidden;">
        
        <aside class="bg-[#161b22] border-r border-[#30363d] flex flex-col items-center py-2 gap-1">
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md bg-[#00d4ff]/20 text-[#00d4ff]" data-tool="cursor"><i data-lucide="mouse-pointer-2" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="trendline"><i data-lucide="trending-up" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="horizontal"><i data-lucide="minus" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="fibonacci"><i data-lucide="git-branch" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="rectangle"><i data-lucide="square" class="w-4 h-4"></i></button>
            <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]" data-tool="text"><i data-lucide="type" class="w-4 h-4"></i></button>
        </aside>
        
        <main class="relative bg-[#0d1117]">
            <div id="chart"></div>
            
            <div class="absolute top-4 left-4 bg-[#161b22]/90 border border-[#30363d] rounded-lg px-3 py-2 flex items-center gap-4 z-10">
                <div class="flex items-center gap-2">
                    <span class="text-[#f0f6fc] font-semibold text-sm" id="legendSymbol">BTCUSD</span>
                    <span class="text-[#8b949e] text-xs">·</span>
                    <span class="text-[#8b949e] text-xs" id="legendTimeframe">4H</span>
                </div>
                <div class="flex items-center gap-3 text-xs font-mono">
                    <span class="text-[#8b949e]">O <span id="legendOpen" class="text-[#3fb950]">-</span></span>
                    <span class="text-[#8b949e]">H <span id="legendHigh" class="text-[#3fb950]">-</span></span>
                    <span class="text-[#8b949e]">L <span id="legendLow" class="text-[#f85149]">-</span></span>
                    <span class="text-[#8b949e]">C <span id="legendClose" class="text-[#3fb950]">-</span></span>
                </div>
            </div>
            
            <div class="absolute top-4 right-4 bg-[#161b22]/90 border border-[#30363d] rounded-lg px-3 py-2 z-10">
                <div class="text-xs text-[#8b949e] mb-1">Price</div>
                <div class="text-lg font-mono font-semibold" id="currentPrice">-</div>
                <div class="text-xs font-mono" id="priceChange">-</div>
            </div>
        </main>
        
        <aside class="bg-[#161b22] border-l border-[#30363d] overflow-y-auto">
            <div class="border-b border-[#30363d]">
                <div class="flex items-center justify-between px-3 py-2">
                    <span class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Indicators</span>
                    <span class="text-xs text-[#8b949e] font-mono" id="indicatorCount">0</span>
                </div>
                <div class="px-2 pb-2 space-y-1" id="indicatorList"></div>
                <div class="px-2 pb-2">
                    <button id="addIndicatorBtn" class="w-full flex items-center justify-center gap-2 py-2 rounded-md border border-dashed border-[#30363d] text-[#8b949e] hover:border-[#00d4ff] hover:text-[#00d4ff] text-xs">
                        <i data-lucide="plus" class="w-3 h-3"></i> Add Indicator
                    </button>
                </div>
            </div>
            
            <div class="border-b border-[#30363d]">
                <div class="flex items-center justify-between px-3 py-2">
                    <span class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Bar Replay</span>
                </div>
                <div class="px-2 pb-2 space-y-2">
                    <div class="grid grid-cols-4 gap-1">
                        <button id="replayStart" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d]"><i data-lucide="play" class="w-4 h-4 text-[#3fb950]"></i></button>
                        <button id="replayPause" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d]"><i data-lucide="pause" class="w-4 h-4 text-[#d29922]"></i></button>
                        <button id="replayStep" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d]"><i data-lucide="skip-forward" class="w-4 h-4 text-[#8b949e]"></i></button>
                        <button id="replayReset" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d]"><i data-lucide="rotate-ccw" class="w-4 h-4 text-[#8b949e]"></i></button>
                    </div>
                    <select id="replaySpeed" class="w-full bg-[#0d1117] border border-[#30363d] rounded-md px-2 py-1.5 text-xs text-[#c9d1d9]">
                        <option value="1">1x Speed</option>
                        <option value="5">5x Speed</option>
                        <option value="10">10x Speed</option>
                    </select>
                    <div class="w-full h-1 bg-[#21262d] rounded-full overflow-hidden">
                        <div class="h-full bg-[#00d4ff] transition-all" id="replayProgress" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
            
            <div class="border-b border-[#30363d]">
                <div class="flex items-center justify-between px-3 py-2">
                    <span class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Watchlist</span>
                    <span class="text-xs text-[#8b949e] font-mono" id="watchlistCount">0</span>
                </div>
                <div class="px-2 pb-2 space-y-0.5" id="watchlistContainer"></div>
            </div>
        </aside>
    </div>
    
    <footer class="bg-[#161b22] border-t border-[#30363d] flex items-center px-4 gap-3 text-xs">
        <div class="flex items-center gap-2">
            <div class="w-1.5 h-1.5 rounded-full bg-[#3fb950]"></div>
            <span class="text-[#8b949e]">Connected</span>
        </div>
        <div class="w-px h-3 bg-[#30363d]"></div>
        <span class="text-[#8b949e]">Symbol: <span class="text-[#c9d1d9] font-mono" id="statusSymbol">BTCUSD</span></span>
        <div class="w-px h-3 bg-[#30363d]"></div>
        <span class="text-[#8b949e]">TF: <span class="text-[#c9d1d9] font-mono" id="statusTimeframe">4H</span></span>
        <div class="flex-1"></div>
        <span class="text-[#8b949e]">UTC: <span class="text-[#c9d1d9] font-mono" id="statusTime">--:--:--</span></span>
    </footer>
</div>

<script>
// ==================== DATA ====================
var SYMBOLS = {
    'BTCUSD': { name: 'Bitcoin', basePrice: 45000, color: '#f7931a' },
    'ETHUSD': { name: 'Ethereum', basePrice: 3000, color: '#627eea' },
    'SOLUSD': { name: 'Solana', basePrice: 100, color: '#14f195' },
    'BNBUSD': { name: 'Binance Coin', basePrice: 300, color: '#f0b90b' },
    'XRPUSD': { name: 'Ripple', basePrice: 0.6, color: '#23292f' },
    'ADAUSD': { name: 'Cardano', basePrice: 0.5, color: '#0033ad' },
    'DOGEUSD': { name: 'Dogecoin', basePrice: 0.08, color: '#c2a633' },
    'AVAXUSD': { name: 'Avalanche', basePrice: 35, color: '#e84142' },
    'DOTUSD': { name: 'Polkadot', basePrice: 7, color: '#e6007a' },
    'MATICUSD': { name: 'Polygon', basePrice: 0.8, color: '#8247e5' },
    'LINKUSD': { name: 'Chainlink', basePrice: 15, color: '#2a5ada' },
    'LTCUSD': { name: 'Litecoin', basePrice: 80, color: '#345d9d' },
    'XAUUSD': { name: 'Gold', basePrice: 2000, color: '#ffd700' },
    'XAGUSD': { name: 'Silver', basePrice: 25, color: '#c0c0c0' },
    'WTIUSD': { name: 'Crude Oil', basePrice: 75, color: '#000000' },
    'AAPL': { name: 'Apple Inc', basePrice: 189, color: '#0071e3' },
    'TSLA': { name: 'Tesla Inc', basePrice: 242, color: '#e82127' },
    'GOOGL': { name: 'Alphabet Inc', basePrice: 140, color: '#4285f4' },
    'MSFT': { name: 'Microsoft', basePrice: 370, color: '#00a4ef' },
    'AMZN': { name: 'Amazon', basePrice: 150, color: '#ff9900' },
    'META': { name: 'Meta Platforms', basePrice: 480, color: '#0668e1' },
    'NVDA': { name: 'NVIDIA', basePrice: 800, color: '#76b900' },
    'NFLX': { name: 'Netflix', basePrice: 600, color: '#e50914' },
    'EURUSD': { name: 'Euro / US Dollar', basePrice: 1.08, color: '#003399' },
    'GBPUSD': { name: 'Pound / US Dollar', basePrice: 1.27, color: '#cf142b' },
    'USDJPY': { name: 'US Dollar / Yen', basePrice: 150, color: '#bc002d' },
    'AUDUSD': { name: 'Aussie / US Dollar', basePrice: 0.65, color: '#00008b' },
    'USDCAD': { name: 'US Dollar / Loonie', basePrice: 1.36, color: '#ff0000' },
    'USDCHF': { name: 'US Dollar / Franc', basePrice: 0.88, color: '#ff0000' },
    'NZDUSD': { name: 'Kiwi / US Dollar', basePrice: 0.60, color: '#000000' },
    'EURGBP': { name: 'Euro / Pound', basePrice: 0.85, color: '#003399' },
    'EURJPY': { name: 'Euro / Yen', basePrice: 162, color: '#003399' },
    'GBPJPY': { name: 'Pound / Yen', basePrice: 190, color: '#cf142b' }
};

var WATCHLIST = ['BTCUSD', 'ETHUSD', 'SOLUSD', 'AAPL', 'TSLA', 'NVDA', 'EURUSD', 'XAUUSD'];

var currentSymbol = 'BTCUSD';
var currentTimeframe = '240';
var chart, candleSeries, volumeSeries;
var allData = [];
var replayIndex = 0;
var replayTimer = null;
var indicatorList = [];

// ==================== GENERATE DATA ====================
function generateData(symbol, timeframe, count) {
    count = count || 500;
    var data = [];
    var info = SYMBOLS[symbol] || { basePrice: 100 };
    var basePrice = info.basePrice;
    var now = Math.floor(Date.now() / 1000);
    var interval = getInterval(timeframe);
    
    var seed = 0;
    for (var c = 0; c < symbol.length; c++) seed += symbol.charCodeAt(c);
    seed += timeframe.length;
    var rand = seed;
    function rnd() {
        rand = (rand * 9301 + 49297) % 233280;
        return rand / 233280;
    }
    
    for (var i = count; i >= 0; i--) {
        var time = now - (i * interval);
        var vol = basePrice * 0.015;
        var open = basePrice + (rnd() - 0.5) * vol;
        var close = open + (rnd() - 0.5) * vol;
        var high = Math.max(open, close) + rnd() * vol * 0.5;
        var low = Math.min(open, close) - rnd() * vol * 0.5;
        var volume = Math.floor(rnd() * 1000000) + 100000;
        data.push({ time: time, open: open, high: high, low: low, close: close, volume: volume });
        basePrice = close;
    }
    return data;
}

function getInterval(tf) {
    var map = { '1': 60, '5': 300, '15': 900, '60': 3600, '240': 14400, 'D': 86400, 'W': 604800 };
    return map[tf] || 14400;
}

// ==================== INIT CHART ====================
function initChart() {
    var container = document.getElementById('chart');
    if (!container) { console.error('Chart container not found'); return; }
    
    console.log('Initializing chart...');
    console.log('Container size:', container.clientWidth, 'x', container.clientHeight);
    
    chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
            background: { color: '#0d1117' },
            textColor: '#8b949e',
            fontFamily: 'JetBrains Mono, monospace',
            fontSize: 11
        },
        grid: {
            vertLines: { color: '#21262d' },
            horzLines: { color: '#21262d' }
        },
        crosshair: {
            mode: 1,
            vertLine: { color: '#00d4ff', width: 1, style: 2, labelBackgroundColor: '#00d4ff' },
            horzLine: { color: '#00d4ff', width: 1, style: 2, labelBackgroundColor: '#00d4ff' }
        },
        rightPriceScale: {
            borderColor: '#30363d',
            scaleMargins: { top: 0.1, bottom: 0.2 }
        },
        timeScale: {
            borderColor: '#30363d',
            timeVisible: true,
            secondsVisible: false
        }
    });
    
    candleSeries = chart.addCandlestickSeries({
        upColor: '#3fb950',
        downColor: '#f85149',
        borderDownColor: '#f85149',
        borderUpColor: '#3fb950',
        wickDownColor: '#f85149',
        wickUpColor: '#3fb950'
    });
    
    volumeSeries = chart.addHistogramSeries({
        color: '#21262d',
        priceFormat: { type: 'volume' },
        priceScaleId: ''
    });
    
    volumeSeries.priceScale().applyOptions({
        scaleMargins: { top: 0.8, bottom: 0 }
    });
    
    chart.subscribeCrosshairMove(function(param) {
        if (!param.time || !param.seriesData) return;
        var data = param.seriesData.get(candleSeries);
        if (data) {
            document.getElementById('legendOpen').textContent = data.open ? data.open.toFixed(2) : '-';
            document.getElementById('legendHigh').textContent = data.high ? data.high.toFixed(2) : '-';
            document.getElementById('legendLow').textContent = data.low ? data.low.toFixed(2) : '-';
            document.getElementById('legendClose').textContent = data.close ? data.close.toFixed(2) : '-';
        }
    });
    
    window.addEventListener('resize', function() {
        chart.applyOptions({
            width: container.clientWidth,
            height: container.clientHeight
        });
    });
    
    console.log('Chart initialized successfully');
}

// ==================== LOAD SYMBOL ====================
function loadSymbol(symbol) {
    symbol = symbol.toUpperCase();
    if (!SYMBOLS[symbol]) {
        SYMBOLS[symbol] = { name: symbol, basePrice: 100, color: '#00d4ff' };
    }
    
    console.log('Loading symbol:', symbol);
    currentSymbol = symbol;
    allData = generateData(symbol, currentTimeframe);
    console.log('Generated', allData.length, 'bars');
    
    if (!candleSeries) { console.error('candleSeries not initialized'); return; }
    
    candleSeries.setData(allData);
    
    var volumeData = allData.map(function(d) {
        return {
            time: d.time,
            value: d.volume,
            color: d.close >= d.open ? 'rgba(63,185,80,0.3)' : 'rgba(248,81,73,0.3)'
        };
    });
    volumeSeries.setData(volumeData);
    
    chart.timeScale().fitContent();
    
    var lastBar = allData[allData.length - 1];
    var firstBar = allData[0];
    var change = ((lastBar.close - firstBar.open) / firstBar.open) * 100;
    
    document.getElementById('legendSymbol').textContent = symbol;
    document.getElementById('statusSymbol').textContent = symbol;
    document.getElementById('symbolSearch').value = symbol;
    document.getElementById('legendOpen').textContent = lastBar.open.toFixed(2);
    document.getElementById('legendHigh').textContent = lastBar.high.toFixed(2);
    document.getElementById('legendLow').textContent = lastBar.low.toFixed(2);
    document.getElementById('legendClose').textContent = lastBar.close.toFixed(2);
    
    document.getElementById('currentPrice').textContent = lastBar.close.toFixed(2);
    var changeEl = document.getElementById('priceChange');
    changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
    changeEl.style.color = change >= 0 ? '#3fb950' : '#f85149';
    
    console.log('Symbol loaded successfully:', symbol);
}

// ==================== WATCHLIST ====================
function renderWatchlist() {
    var container = document.getElementById('watchlistContainer');
    if (!container) return;
    
    var html = '';
    for (var i = 0; i < WATCHLIST.length; i++) {
        var sym = WATCHLIST[i];
        var info = SYMBOLS[sym] || { color: '#00d4ff', name: sym, basePrice: 100 };
        var seed = 0;
        for (var c = 0; c < sym.length; c++) seed += sym.charCodeAt(c);
        var change = ((seed % 1000) / 100) - 5;
        var price = info.basePrice * (1 + change / 100);
        var color = change >= 0 ? '#3fb950' : '#f85149';
        var sign = change >= 0 ? '+' : '';
        
        html += '<div class="watchlist-item flex items-center justify-between px-2 py-1.5 rounded-md hover:bg-[#21262d] cursor-pointer" data-symbol="' + sym + '">';
        html += '<div class="flex items-center gap-2">';
        html += '<div class="w-6 h-6 rounded flex items-center justify-center text-[10px] font-bold text-white" style="background:' + info.color + '">' + sym.charAt(0) + '</div>';
        html += '<div>';
        html += '<div class="text-sm text-[#f0f6fc]">' + sym + '</div>';
        html += '<div class="text-[10px] text-[#8b949e]">' + info.name + '</div>';
        html += '</div></div>';
        html += '<div class="text-right">';
        html += '<div class="text-sm font-mono text-[#f0f6fc]">' + price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</div>';
        html += '<div class="text-xs font-mono" style="color:' + color + '">' + sign + change.toFixed(2) + '%</div>';
        html += '</div></div>';
    }
    container.innerHTML = html;
    
    document.getElementById('watchlistCount').textContent = WATCHLIST.length;
    
    var items = container.querySelectorAll('.watchlist-item');
    for (var j = 0; j < items.length; j++) {
        items[j].addEventListener('click', function() {
            loadSymbol(this.getAttribute('data-symbol'));
        });
    }
    
    console.log('Watchlist rendered:', WATCHLIST.length, 'items');
}

// ==================== SEARCH ====================
function initSearch() {
    var input = document.getElementById('symbolSearch');
    var dropdown = document.getElementById('searchDropdown');
    if (!input || !dropdown) return;
    
    input.addEventListener('input', function(e) {
        var query = e.target.value.toUpperCase().trim();
        if (!query) { dropdown.style.display = 'none'; return; }
        
        var matches = [];
        for (var sym in SYMBOLS) {
            if (sym.indexOf(query) !== -1 || SYMBOLS[sym].name.toUpperCase().indexOf(query) !== -1) {
                matches.push(sym);
                if (matches.length >= 10) break;
            }
        }
        
        if (matches.length === 0) { dropdown.style.display = 'none'; return; }
        
        var html = '';
        for (var i = 0; i < matches.length; i++) {
            var sym = matches[i];
            var info = SYMBOLS[sym];
            html += '<div class="search-result flex items-center gap-2 px-3 py-2 hover:bg-[#21262d] cursor-pointer border-b border-[#30363d]" data-symbol="' + sym + '">';
            html += '<div class="w-6 h-6 rounded flex items-center justify-center text-[10px] font-bold text-white" style="background:' + info.color + '">' + sym.charAt(0) + '</div>';
            html += '<div>';
            html += '<div class="text-sm text-[#f0f6fc]">' + sym + '</div>';
            html += '<div class="text-[10px] text-[#8b949e]">' + info.name + '</div>';
            html += '</div></div>';
        }
        dropdown.innerHTML = html;
        dropdown.style.display = 'block';
        
        var results = dropdown.querySelectorAll('.search-result');
        for (var j = 0; j < results.length; j++) {
            results[j].addEventListener('click', function() {
                loadSymbol(this.getAttribute('data-symbol'));
                dropdown.style.display = 'none';
                input.value = this.getAttribute('data-symbol');
            });
        }
    });
    
    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            loadSymbol(e.target.value);
            dropdown.style.display = 'none';
        }
    });
}

// ==================== REPLAY ====================
function initReplay() {
    var startBtn = document.getElementById('replayStart');
    var pauseBtn = document.getElementById('replayPause');
    var stepBtn = document.getElementById('replayStep');
    var resetBtn = document.getElementById('replayReset');
    
    if (startBtn) startBtn.addEventListener('click', function() {
        if (replayTimer) return;
        var speed = parseInt(document.getElementById('replaySpeed').value) || 1;
        replayTimer = setInterval(function() {
            if (replayIndex >= allData.length) {
                clearInterval(replayTimer);
                replayTimer = null;
                return;
            }
            candleSeries.update(allData[replayIndex]);
            replayIndex++;
            var progress = (replayIndex / allData.length) * 100;
            document.getElementById('replayProgress').style.width = progress + '%';
        }, 1000 / speed);
    });
    
    if (pauseBtn) pauseBtn.addEventListener('click', function() {
        if (replayTimer) { clearInterval(replayTimer); replayTimer = null; }
    });
    
    if (resetBtn) resetBtn.addEventListener('click', function() {
        if (replayTimer) { clearInterval(replayTimer); replayTimer = null; }
        replayIndex = 0;
        document.getElementById('replayProgress').style.width = '0%';
        loadSymbol(currentSymbol);
    });
    
    if (stepBtn) stepBtn.addEventListener('click', function() {
        if (replayIndex < allData.length) {
            candleSeries.update(allData[replayIndex]);
            replayIndex++;
            var progress = (replayIndex / allData.length) * 100;
            document.getElementById('replayProgress').style.width = progress + '%';
        }
    });
}

// ==================== EVENTS ====================
function initEvents() {
    // Timeframe buttons
    var tfBtns = document.querySelectorAll('.tf-btn');
    for (var i = 0; i < tfBtns.length; i++) {
        tfBtns[i].addEventListener('click', function() {
            for (var j = 0; j < tfBtns.length; j++) {
                tfBtns[j].className = 'tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d]';
            }
            this.className = 'tf-btn px-3 py-1 text-xs font-medium rounded text-[#f0f6fc] bg-[#00d4ff]/20 border border-[#00d4ff]/30';
            currentTimeframe = this.getAttribute('data-tf');
            var label = currentTimeframe === 'D' ? '1D' : currentTimeframe === 'W' ? '1W' : currentTimeframe + 'm';
            document.getElementById('legendTimeframe').textContent = label;
            document.getElementById('statusTimeframe').textContent = label;
            loadSymbol(currentSymbol);
        });
    }
    
    // Tool buttons
    var toolBtns = document.querySelectorAll('.tool-btn');
    for (var i = 0; i < toolBtns.length; i++) {
        toolBtns[i].addEventListener('click', function() {
            for (var j = 0; j < toolBtns.length; j++) {
                toolBtns[j].className = 'tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d]';
            }
            this.className = 'tool-btn w-9 h-9 flex items-center justify-center rounded-md bg-[#00d4ff]/20 text-[#00d4ff]';
        });
    }
    
    // Clock
    setInterval(function() {
        var now = new Date();
        document.getElementById('statusTime').textContent = now.toLocaleTimeString('en-GB', { hour12: false, timeZone: 'UTC' });
    }, 1000);
}
