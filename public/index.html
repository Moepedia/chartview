<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebolus Terminal - Real Data</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Lightweight Charts v4 - STABIL -->
    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #2962ff;
            --success: #3fb950;
            --danger: #f85149;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }
        
        .app-container {
            display: grid;
            grid-template-rows: 48px 1fr 28px;
            height: 100vh;
        }
        
        /* Top Toolbar */
        .top-toolbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 12px;
            border-right: 1px solid var(--border-color);
        }
        
        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent), #00d4ff);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-icon svg { width: 16px; height: 16px; stroke: white; }
        .logo-text { font-weight: 600; font-size: 14px; }
        
        .symbol-search {
            position: relative;
            width: 200px;
        }
        
        .symbol-search input {
            width: 100%;
            height: 32px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0 12px 0 36px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .symbol-search input:focus { outline: none; border-color: var(--accent); }
        
        .symbol-search svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            pointer-events: none;
        }
        
        .timezone-selector {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 12px;
            padding: 6px 10px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .timezone-selector:focus { outline: none; border-color: var(--accent); }
        
        .timeframe-group {
            display: flex;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
            gap: 2px;
        }
        
        .tf-btn {
            padding: 4px 10px;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }
        
        .tf-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .tf-btn.active { background: var(--accent); color: white; }
        
        .spacer { flex: 1; }
        
        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 48px 1fr 280px;
            overflow: hidden;
        }
        
        /* Left Toolbar */
        .left-toolbar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            gap: 4px;
        }
        
        .tool-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .tool-btn svg { width: 18px; height: 18px; stroke: var(--text-secondary); }
        .tool-btn:hover { background: var(--bg-tertiary); }
        .tool-btn.active { background: rgba(41, 98, 255, 0.15); }
        .tool-btn.active svg { stroke: var(--accent); }
        
        /* Chart Area */
        .chart-area {
            position: relative;
            background: var(--bg-primary);
        }
        
        #chart { width: 100%; height: 100%; }
        
        .chart-legend {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }
        
        .legend-symbol-name { font-weight: 600; font-size: 13px; }
        .legend-symbol-tf {
            font-size: 11px;
            color: var(--text-secondary);
            padding: 2px 6px;
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        
        .legend-ohlc {
            display: flex;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }
        
        .legend-ohlc-label { color: var(--text-secondary); }
        .legend-ohlc-value { color: var(--success); }
        
        .price-display {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            z-index: 10;
            text-align: right;
        }
        
        .price-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
        .price-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; }
        .price-change { font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-top: 2px; }
        .price-change.positive { color: var(--success); }
        .price-change.negative { color: var(--danger); }
        
        .connection-status {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 10;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Right Panel */
        .right-panel {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
        }
        
        .panel-section { border-bottom: 1px solid var(--border-color); }
        
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
        }
        
        .panel-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        
        .panel-content { padding: 0 8px 8px; }
        
        .watchlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .watchlist-item:hover { background: var(--bg-tertiary); }
        
        .watchlist-symbol { display: flex; align-items: center; gap: 8px; }
        
        .watchlist-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: white;
        }
        
        .watchlist-name { font-size: 13px; }
        .watchlist-price { text-align: right; }
        .watchlist-price-value { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        
        /* Bottom Bar */
        .bottom-bar {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 16px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .status-item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
        .status-value { color: var(--text-primary); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="top-toolbar">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
                    <polyline points="16 7 22 7 22 13"/>
                </svg>
            </div>
            <span class="logo-text">Nebolus</span>
        </div>
        
        <div class="symbol-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" id="symbolInput" placeholder="Symbol..." value="XAUUSD">
        </div>
        
        <select class="timezone-selector" id="timezoneSelector">
            <option value="UTC">UTC</option>
            <option value="Asia/Jakarta">WIB</option>
            <option value="Asia/Singapore">SGT</option>
            <option value="America/New_York">EST</option>
            <option value="Europe/London">GMT</option>
            <option value="Asia/Tokyo">JST</option>
        </select>
        
        <div class="timeframe-group">
            <button class="tf-btn" data-tf="1">1m</button>
            <button class="tf-btn" data-tf="5">5m</button>
            <button class="tf-btn" data-tf="15">15m</button>
            <button class="tf-btn" data-tf="60">1H</button>
            <button class="tf-btn active" data-tf="240">4H</button>
            <button class="tf-btn" data-tf="D">1D</button>
        </div>
        
        <div class="spacer"></div>
        
        <button class="tool-btn" id="refreshBtn" title="Refresh Data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
        </button>
    </header>
    
    <div class="main-content">
        <aside class="left-toolbar">
            <button class="tool-btn active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                </svg>
            </button>
            <button class="tool-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="20" x2="20" y2="4"/>
                </svg>
            </button>
            <button class="tool-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"/>
                </svg>
            </button>
        </aside>
        
        <main class="chart-area">
            <div id="chart"></div>
            
            <div class="chart-legend">
                <span class="legend-symbol-name" id="legendSymbol">XAUUSD</span>
                <span class="legend-symbol-tf" id="legendTF">4H</span>
                <div class="legend-ohlc">
                    <span><span class="legend-ohlc-label">O</span> <span class="legend-ohlc-value" id="legendO">-</span></span>
                    <span><span class="legend-ohlc-label">H</span> <span class="legend-ohlc-value" id="legendH">-</span></span>
                    <span><span class="legend-ohlc-label">L</span> <span class="legend-ohlc-value" id="legendL">-</span></span>
                    <span><span class="legend-ohlc-label">C</span> <span class="legend-ohlc-value" id="legendC">-</span></span>
                </div>
            </div>
            
            <div class="price-display">
                <div class="price-label">Last Price</div>
                <div class="price-value" id="currentPrice">-</div>
                <div class="price-change positive" id="priceChange">-</div>
            </div>
            
            <div class="connection-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="connectionText">Connecting...</span>
            </div>
        </main>
        
        <aside class="right-panel">
            <div class="panel-section">
                <div class="panel-header">
                    <span class="panel-title">Watchlist</span>
                </div>
                <div class="panel-content" id="watchlistContainer"></div>
            </div>
        </aside>
    </div>
    
    <footer class="bottom-bar">
        <div class="status-item">
            <div class="status-dot"></div>
            <span id="footerStatus">Connecting...</span>
        </div>
        <div class="status-item">
            <span>Symbol:</span>
            <span class="status-value" id="statusSymbol">XAUUSD</span>
        </div>
        <div class="status-item">
            <span>TF:</span>
            <span class="status-value" id="statusTF">4H</span>
        </div>
        <div class="status-item">
            <span>Bars:</span>
            <span class="status-value" id="statusBars">0</span>
        </div>
        <div class="spacer"></div>
        <div class="status-item">
            <span id="statusTimezone">UTC</span>:
            <span class="status-value" id="statusTime">--:--:--</span>
        </div>
    </footer>
</div>

<script>
// ==================== SYMBOLS DATABASE ====================
const SYMBOLS = {
    'XAUUSD': { name: 'Gold', color: '#ffd700', category: 'Commodity' },
    'XAGUSD': { name: 'Silver', color: '#c0c0c0', category: 'Commodity' },
    'BTCUSD': { name: 'Bitcoin', color: '#f7931a', category: 'Crypto' },
    'ETHUSD': { name: 'Ethereum', color: '#627eea', category: 'Crypto' },
    'SOLUSD': { name: 'Solana', color: '#14f195', category: 'Crypto' },
    'BNBUSD': { name: 'Binance Coin', color: '#f0b90b', category: 'Crypto' },
    'EURUSD': { name: 'EUR/USD', color: '#003399', category: 'Forex' },
    'GBPUSD': { name: 'GBP/USD', color: '#cf142b', category: 'Forex' },
    'USDJPY': { name: 'USD/JPY', color: '#bc002d', category: 'Forex' },
    'AUDUSD': { name: 'AUD/USD', color: '#00008b', category: 'Forex' }
};

const WATCHLIST = ['XAUUSD', 'XAGUSD', 'BTCUSD', 'ETHUSD', 'EURUSD', 'GBPUSD'];

// ==================== STATE ====================
let chart, candleSeries;
let currentSymbol = 'XAUUSD';
let currentTimeframe = '240';
let currentTimezone = 'UTC';
let allData = [];
let currentPrice = 0;
let updateInterval = null;
let lastUpdatedAt = 0;

// ==================== INIT CHART ====================
function initChart() {
    const container = document.getElementById('chart');
    
    chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
            background: { color: '#0d1117' },
            textColor: '#8b949e',
            fontFamily: 'JetBrains Mono, monospace',
            fontSize: 11
        },
        grid: {
            vertLines: { color: '#21262d' },
            horzLines: { color: '#21262d' }
        },
        crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
            vertLine: { color: '#2962ff', width: 1, style: 2, labelBackgroundColor: '#2962ff' },
            horzLine: { color: '#2962ff', width: 1, style: 2, labelBackgroundColor: '#2962ff' }
        },
        rightPriceScale: {
            borderColor: '#30363d',
            scaleMargins: { top: 0.1, bottom: 0.2 }
        },
        timeScale: {
            borderColor: '#30363d',
            timeVisible: true,
            secondsVisible: false
        },
        localization: {
            timeFormatter: (time) => {
                const date = new Date(time * 1000);
                return date.toLocaleString('en-GB', {
                    timeZone: currentTimezone,
                    hour12: false,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
        }
    });
    
    candleSeries = chart.addCandlestickSeries({
        upColor: '#3fb950',
        downColor: '#f85149',
        borderDownColor: '#f85149',
        borderUpColor: '#3fb950',
        wickDownColor: '#f85149',
        wickUpColor: '#3fb950'
    });
    
    chart.subscribeCrosshairMove((param) => {
        if (!param.time || !param.seriesData) return;
        const data = param.seriesData.get(candleSeries);
        if (data) {
            document.getElementById('legendO').textContent = data.open?.toFixed(2) || '-';
            document.getElementById('legendH').textContent = data.high?.toFixed(2) || '-';
            document.getElementById('legendL').textContent = data.low?.toFixed(2) || '-';
            document.getElementById('legendC').textContent = data.close?.toFixed(2) || '-';
        }
    });
    
    window.addEventListener('resize', () => {
        chart.applyOptions({
            width: container.clientWidth,
            height: container.clientHeight
        });
    });
}

// ==================== FETCH PRICE VIA SERVERLESS PROXY ====================
async function fetchPrice(symbol) {
    try {
        const response = await fetch(`/api/price?symbol=${symbol}`);
        const json = await response.json();
        
        if (!json.success) {
            throw new Error(json.error || 'Failed to fetch');
        }
        
        return {
            price: json.price,
            updatedAt: json.updatedAt
        };
    } catch (error) {
        console.error('Fetch error:', error);
        throw error;
    }
}

// ==================== BUILD CANDLES FROM REAL PRICE ====================
function buildCandlesFromPrice(realPrice, count = 500, intervalSeconds = 14400) {
    const candles = [];
    const now = Math.floor(Date.now() / 1000);
    const startTime = now - (count * intervalSeconds);
    
    // Seeded random for consistency
    let seed = Math.floor(realPrice * 100);
    const random = () => {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
    };
    
    // Start from a realistic historical price (slightly below current)
    let price = realPrice * 0.92;
    const volatility = realPrice * 0.008;
    
    for (let i = 0; i < count; i++) {
        const time = startTime + (i * intervalSeconds);
        
        // Gradual trend toward real price
        const progress = i / count;
        const targetPrice = realPrice * (0.92 + (0.08 * progress));
        
        const open = price;
        const range = volatility * (0.5 + random());
        const close = targetPrice + (random() - 0.5) * range;
        const high = Math.max(open, close) + random() * range * 0.3;
        const low = Math.min(open, close) - random() * range * 0.3;
        
        candles.push({
            time: time,
            open: open,
            high: high,
            low: low,
            close: close
        });
        
        price = close;
    }
    
    // Last candle = real price
    const lastCandle = candles[candles.length - 1];
    lastCandle.close = realPrice;
    lastCandle.high = Math.max(lastCandle.high, realPrice);
    lastCandle.low = Math.min(lastCandle.low, realPrice);
    
    return candles;
}

// ==================== LOAD SYMBOL ====================
async function loadSymbol(symbol) {
    currentSymbol = symbol.toUpperCase();
    
    if (!SYMBOLS[currentSymbol]) {
        alert(`Symbol ${currentSymbol} tidak tersedia.\n\nTersedia: ${Object.keys(SYMBOLS).join(', ')}`);
        return;
    }
    
    setConnectionStatus('Fetching...', 'warning');
    
    try {
        const { price, updatedAt } = await fetchPrice(currentSymbol);
        currentPrice = price;
        lastUpdatedAt = updatedAt;
        
        console.log(`✅ ${currentSymbol}: $${price.toFixed(2)}`);
        
        // Build candles from real price
        const intervalSec = getIntervalSeconds(currentTimeframe);
        allData = buildCandlesFromPrice(price, 500, intervalSec);
        
        candleSeries.setData(allData);
        chart.timeScale().fitContent();
        
        // Update UI
        document.getElementById('legendSymbol').textContent = currentSymbol;
        document.getElementById('statusSymbol').textContent = currentSymbol;
        document.getElementById('statusBars').textContent = allData.length;
        document.getElementById('legendTF').textContent = getTFLabel(currentTimeframe);
        document.getElementById('statusTF').textContent = getTFLabel(currentTimeframe);
        
        // Price display
        document.getElementById('currentPrice').textContent = `$${price.toFixed(2)}`;
        const changeEl = document.getElementById('priceChange');
        const firstPrice = allData[0].open;
        const change = ((price - firstPrice) / firstPrice) * 100;
        changeEl.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
        changeEl.className = 'price-change ' + (change >= 0 ? 'positive' : 'negative');
        
        setConnectionStatus('Connected', 'success');
        updateTimeDisplay(updatedAt);
        
    } catch (error) {
        console.error('Failed to load symbol:', error);
        setConnectionStatus('Error - Retrying...', 'error');
        setTimeout(() => loadSymbol(symbol), 5000);
    }
}

// ==================== REALTIME UPDATES ====================
function startRealtimeUpdates() {
    if (updateInterval) clearInterval(updateInterval);
    
    updateInterval = setInterval(async () => {
        if (!SYMBOLS[currentSymbol]) return;
        
        try {
            const { price, updatedAt } = await fetchPrice(currentSymbol);
            
            if (price !== currentPrice) {
                currentPrice = price;
                lastUpdatedAt = updatedAt;
                
                // Update last candle
                const lastCandle = allData[allData.length - 1];
                lastCandle.close = price;
                lastCandle.high = Math.max(lastCandle.high, price);
                lastCandle.low = Math.min(lastCandle.low, price);
                
                candleSeries.update(lastCandle);
                
                // Update UI
                document.getElementById('currentPrice').textContent = `$${price.toFixed(2)}`;
                
                const firstPrice = allData[0].open;
                const change = ((price - firstPrice) / firstPrice) * 100;
                const changeEl = document.getElementById('priceChange');
                changeEl.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
                changeEl.className = 'price-change ' + (change >= 0 ? 'positive' : 'negative');
                
                updateTimeDisplay(updatedAt);
            }
        } catch (e) {
            console.warn('Update failed:', e.message);
        }
    }, 15000); // Update tiap 15 detik
}

// ==================== HELPERS ====================
function getIntervalSeconds(tf) {
    const map = { '1': 60, '5': 300, '15': 900, '60': 3600, '240': 14400, 'D': 86400 };
    return map[tf] || 14400;
}

function getTFLabel(tf) {
    const map = { '1': '1m', '5': '5m', '15': '15m', '60': '1H', '240': '4H', 'D': '1D' };
    return map[tf] || tf;
}

function setConnectionStatus(text, type) {
    document.getElementById('connectionText').textContent = text;
    document.getElementById('footerStatus').textContent = text;
    
    const dot = document.getElementById('statusDot');
    dot.style.background = type === 'success' ? '#3fb950' : type === 'error' ? '#f85149' : '#d29922';
}

function updateTimeDisplay(timestamp) {
    const date = new Date(timestamp * 1000);
    const formatted = date.toLocaleString('en-GB', {
        timeZone: currentTimezone,
        hour12: false,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
    document.getElementById('statusTime').textContent = formatted;
}

// ==================== WATCHLIST ====================
async function renderWatchlist() {
    const container = document.getElementById('watchlistContainer');
    
    container.innerHTML = WATCHLIST.map(sym => {
        const info = SYMBOLS[sym];
        return `
            <div class="watchlist-item" data-symbol="${sym}">
                <div class="watchlist-symbol">
                    <div class="watchlist-icon" style="background: ${info.color}">${sym.charAt(0)}</div>
                    <span class="watchlist-name">${sym}</span>
                </div>
                <div class="watchlist-price">
                    <div class="watchlist-price-value" id="wl-${sym}-price">-</div>
                </div>
            </div>
        `;
    }).join('');
    
    // Fetch prices for all watchlist
    for (const sym of WATCHLIST) {
        try {
            const { price } = await fetchPrice(sym);
            document.getElementById(`wl-${sym}-price`).textContent = `$${price.toFixed(2)}`;
        } catch (e) {
            document.getElementById(`wl-${sym}-price`).textContent = 'N/A';
        }
    }
    
    container.querySelectorAll('.watchlist-item').forEach(item => {
        item.addEventListener('click', () => loadSymbol(item.dataset.symbol));
    });
}

// ==================== EVENTS ====================
function initEvents() {
    document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTimeframe = btn.dataset.tf;
            loadSymbol(currentSymbol);
        });
    });
    
    document.getElementById('symbolInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const symbol = e.target.value.trim().toUpperCase();
            if (SYMBOLS[symbol]) {
                loadSymbol(symbol);
            } else {
                alert(`Symbol ${symbol} tidak tersedia.\n\nTersedia: ${Object.keys(SYMBOLS).join(', ')}`);
            }
        }
    });
    
    document.getElementById('timezoneSelector').addEventListener('change', (e) => {
        currentTimezone = e.target.value;
        document.getElementById('statusTimezone').textContent = currentTimezone;
        
        chart.applyOptions({
            localization: {
                timeFormatter: (time) => {
                    const date = new Date(time * 1000);
                    return date.toLocaleString('en-GB', {
                        timeZone: currentTimezone,
                        hour12: false,
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
            }
        });
    });
    
    document.getElementById('refreshBtn').addEventListener('click', () => {
        loadSymbol(currentSymbol);
    });
    
    // Live clock
    setInterval(() => {
        const now = new Date();
        const formatted = now.toLocaleTimeString('en-GB', {
            timeZone: currentTimezone,
            hour12: false
        });
        document.getElementById('statusTime').textContent = formatted;
    }, 1000);
}

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', async () => {
    initChart();
    initEvents();
    await loadSymbol('XAUUSD');
    await renderWatchlist();
    startRealtimeUpdates();
});
</script>

</body>
