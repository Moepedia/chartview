<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebolus Terminal — Professional Trading</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- OakView Chart Engine -->
    <script type="module">
        import 'https://cdn.jsdelivr.net/npm/oakview@0.3.0/dist/oakview.js';
    </script>
</head>
<body class="bg-[#0d1117] text-[#c9d1d9] font-['Inter'] overflow-hidden">
    
    <!-- App Container -->
    <div class="h-screen grid grid-rows-[48px_1fr_24px]">
        
        <!-- ===== TOP HEADER ===== -->
        <header class="bg-[#161b22] border-b border-[#30363d] flex items-center px-4 gap-4">
            
            <!-- Logo -->
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 bg-[#00d4ff] rounded flex items-center justify-center">
                    <i data-lucide="trending-up" class="w-4 h-4 text-[#0d1117]"></i>
                </div>
                <span class="font-semibold text-[#f0f6fc] text-sm tracking-tight">Nebolus</span>
            </div>
            
            <!-- Divider -->
            <div class="w-px h-6 bg-[#30363d]"></div>
            
            <!-- Symbol Search -->
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#8b949e]"></i>
                <input 
                    type="text" 
                    id="symbolSearch"
                    placeholder="Search symbol..."
                    class="w-64 bg-[#0d1117] border border-[#30363d] rounded-md pl-9 pr-3 py-1.5 text-sm text-[#f0f6fc] placeholder-[#8b949e] focus:outline-none focus:border-[#00d4ff] transition-colors"
                >
            </div>
            
            <!-- Timeframe Pills -->
            <div class="flex items-center gap-1 bg-[#0d1117] rounded-md p-1 border border-[#30363d]">
                <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d] transition-all" data-tf="1">1m</button>
                <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d] transition-all" data-tf="5">5m</button>
                <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d] transition-all" data-tf="15">15m</button>
                <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d] transition-all" data-tf="60">1H</button>
                <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#f0f6fc] bg-[#00d4ff]/20 border border-[#00d4ff]/30 transition-all" data-tf="240">4H</button>
                <button class="tf-btn px-3 py-1 text-xs font-medium rounded text-[#8b949e] hover:text-[#f0f6fc] hover:bg-[#21262d] transition-all" data-tf="D">1D</button>
            </div>
            
            <!-- Chart Type -->
            <div class="flex items-center gap-1 bg-[#0d1117] rounded-md p-1 border border-[#30363d]">
                <button class="chart-type-btn p-1.5 rounded bg-[#21262d] text-[#00d4ff]" data-type="candlestick">
                    <i data-lucide="candlestick-chart" class="w-4 h-4"></i>
                </button>
                <button class="chart-type-btn p-1.5 rounded text-[#8b949e] hover:text-[#f0f6fc]" data-type="line">
                    <i data-lucide="line-chart" class="w-4 h-4"></i>
                </button>
                <button class="chart-type-btn p-1.5 rounded text-[#8b949e] hover:text-[#f0f6fc]" data-type="area">
                    <i data-lucide="area-chart" class="w-4 h-4"></i>
                </button>
            </div>
            
            <!-- Spacer -->
            <div class="flex-1"></div>
            
            <!-- Actions -->
            <button class="p-2 rounded-md hover:bg-[#21262d] transition-colors" title="Compare">
                <i data-lucide="git-compare" class="w-4 h-4 text-[#8b949e]"></i>
            </button>
            <button class="p-2 rounded-md hover:bg-[#21262d] transition-colors" title="Alerts">
                <i data-lucide="bell" class="w-4 h-4 text-[#8b949e]"></i>
            </button>
            <button class="p-2 rounded-md hover:bg-[#21262d] transition-colors" title="Settings">
                <i data-lucide="settings" class="w-4 h-4 text-[#8b949e]"></i>
            </button>
        </header>
        
        <!-- ===== MAIN AREA ===== -->
        <div class="grid grid-cols-[48px_1fr_280px] overflow-hidden">
            
            <!-- Left Toolbar -->
            <aside class="bg-[#161b22] border-r border-[#30363d] flex flex-col items-center py-2 gap-1">
                <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md bg-[#00d4ff]/20 text-[#00d4ff]" data-tool="cursor" title="Cursor">
                    <i data-lucide="mouse-pointer-2" class="w-4 h-4"></i>
                </button>
                <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d] hover:text-[#f0f6fc] transition-all" data-tool="trendline" title="Trend Line">
                    <i data-lucide="trending-up" class="w-4 h-4"></i>
                </button>
                <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d] hover:text-[#f0f6fc] transition-all" data-tool="horizontal" title="Horizontal Line">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
                <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d] hover:text-[#f0f6fc] transition-all" data-tool="fibonacci" title="Fibonacci">
                    <i data-lucide="git-branch" class="w-4 h-4"></i>
                </button>
                <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d] hover:text-[#f0f6fc] transition-all" data-tool="rectangle" title="Rectangle">
                    <i data-lucide="square" class="w-4 h-4"></i>
                </button>
                <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d] hover:text-[#f0f6fc] transition-all" data-tool="text" title="Text">
                    <i data-lucide="type" class="w-4 h-4"></i>
                </button>
                
                <div class="w-6 h-px bg-[#30363d] my-2"></div>
                
                <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d] hover:text-[#f0f6fc] transition-all" data-tool="measure" title="Measure">
                    <i data-lucide="ruler" class="w-4 h-4"></i>
                </button>
                <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d] hover:text-[#f0f6fc] transition-all" data-tool="zoom" title="Zoom">
                    <i data-lucide="zoom-in" class="w-4 h-4"></i>
                </button>
                <button class="tool-btn w-9 h-9 flex items-center justify-center rounded-md text-[#8b949e] hover:bg-[#21262d] hover:text-[#f0f6fc] transition-all" data-tool="delete" title="Delete">
                    <i data-lucide="eraser" class="w-4 h-4"></i>
                </button>
            </aside>
            
            <!-- Chart Area -->
            <main class="relative bg-[#0d1117]">
                <oak-view 
                    id="chart" 
                    symbol="BTCUSD" 
                    theme="dark"
                    layout="single"
                    class="w-full h-full"
                ></oak-view>
                
                <!-- Floating Legend -->
                <div class="absolute top-4 left-4 bg-[#161b22]/90 backdrop-blur border border-[#30363d] rounded-lg px-3 py-2 flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <span class="text-[#f0f6fc] font-semibold text-sm" id="legendSymbol">BTCUSD</span>
                        <span class="text-[#8b949e] text-xs">·</span>
                        <span class="text-[#8b949e] text-xs" id="legendTimeframe">4H</span>
                    </div>
                    <div class="flex items-center gap-3 text-xs">
                        <span class="text-[#8b949e]">O <span class="text-[#3fb950]" id="legendOpen">45,231.50</span></span>
                        <span class="text-[#8b949e]">H <span class="text-[#3fb950]" id="legendHigh">45,892.00</span></span>
                        <span class="text-[#8b949e]">L <span class="text-[#f85149]" id="legendLow">44,921.25</span></span>
                        <span class="text-[#8b949e]">C <span class="text-[#3fb950]" id="legendClose">45,750.75</span></span>
                    </div>
                </div>
            </main>
            
            <!-- Right Panel -->
            <aside class="bg-[#161b22] border-l border-[#30363d] overflow-y-auto">
                
                <!-- Indicators Section -->
                <div class="border-b border-[#30363d]">
                    <div class="flex items-center justify-between px-3 py-2">
                        <span class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Indicators</span>
                        <span class="text-xs text-[#8b949e]" id="indicatorCount">0</span>
                    </div>
                    <div class="px-2 pb-2 space-y-1" id="indicatorList">
                        <!-- Indicators will be added here -->
                    </div>
                    <div class="px-2 pb-2">
                        <button id="addIndicatorBtn" class="w-full flex items-center justify-center gap-2 py-2 rounded-md border border-dashed border-[#30363d] text-[#8b949e] hover:border-[#00d4ff] hover:text-[#00d4ff] transition-all text-xs">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                            Add Indicator
                        </button>
                    </div>
                </div>
                
                <!-- Bar Replay Section -->
                <div class="border-b border-[#30363d]">
                    <div class="flex items-center justify-between px-3 py-2">
                        <span class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Bar Replay</span>
                        <i data-lucide="history" class="w-3 h-3 text-[#8b949e]"></i>
                    </div>
                    <div class="px-2 pb-2 space-y-2">
                        <!-- Replay Controls -->
                        <div class="grid grid-cols-4 gap-1">
                            <button id="replayStart" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d] transition-colors" title="Play">
                                <i data-lucide="play" class="w-4 h-4 text-[#3fb950]"></i>
                            </button>
                            <button id="replayPause" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d] transition-colors" title="Pause">
                                <i data-lucide="pause" class="w-4 h-4 text-[#d29922]"></i>
                            </button>
                            <button id="replayStep" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d] transition-colors" title="Step Forward">
                                <i data-lucide="skip-forward" class="w-4 h-4 text-[#8b949e]"></i>
                            </button>
                            <button id="replayReset" class="flex items-center justify-center py-2 rounded-md bg-[#21262d] hover:bg-[#30363d] transition-colors" title="Reset">
                                <i data-lucide="rotate-ccw" class="w-4 h-4 text-[#8b949e]"></i>
                            </button>
                        </div>
                        
                        <!-- Speed Selector -->
                        <select id="replaySpeed" class="w-full bg-[#0d1117] border border-[#30363d] rounded-md px-2 py-1.5 text-xs text-[#c9d1d9] focus:outline-none focus:border-[#00d4ff]">
                            <option value="1">1x Speed</option>
                            <option value="2">2x Speed</option>
                            <option value="5">5x Speed</option>
                            <option value="10">10x Speed</option>
                            <option value="20">20x Speed</option>
                        </select>
                        
                        <!-- Progress Bar -->
                        <div class="w-full h-1 bg-[#21262d] rounded-full overflow-hidden">
                            <div class="h-full bg-[#00d4ff] w-0 transition-all" id="replayProgress"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Watchlist Section -->
                <div class="border-b border-[#30363d]">
                    <div class="flex items-center justify-between px-3 py-2">
                        <span class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Watchlist</span>
                        <button class="text-[#8b949e] hover:text-[#00d4ff] transition-colors">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                        </button>
                    </div>
                    <div class="px-2 pb-2 space-y-0.5">
                        <div class="watchlist-item flex items-center justify-between px-2 py-1.5 rounded-md hover:bg-[#21262d] cursor-pointer transition-colors" data-symbol="BTCUSD">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 bg-[#f7931a] rounded flex items-center justify-center text-[10px] font-bold text-white">B</div>
                                <span class="text-sm text-[#f0f6fc]">BTCUSD</span>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-mono text-[#f0f6fc]">45,750.75</div>
                                <div class="text-xs font-mono text-[#3fb950]">+2.34%</div>
                            </div>
                        </div>
                        <div class="watchlist-item flex items-center justify-between px-2 py-1.5 rounded-md hover:bg-[#21262d] cursor-pointer transition-colors" data-symbol="ETHUSD">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 bg-[#627eea] rounded flex items-center justify-center text-[10px] font-bold text-white">E</div>
                                <span class="text-sm text-[#f0f6fc]">ETHUSD</span>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-mono text-[#f0f6fc]">2,845.30</div>
                                <div class="text-xs font-mono text-[#f85149]">-0.87%</div>
                            </div>
                        </div>
                        <div class="watchlist-item flex items-center justify-between px-2 py-1.5 rounded-md hover:bg-[#21262d] cursor-pointer transition-colors" data-symbol="AAPL">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 bg-[#0071e3] rounded flex items-center justify-center text-[10px] font-bold text-white">A</div>
                                <span class="text-sm text-[#f0f6fc]">AAPL</span>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-mono text-[#f0f6fc]">189.45</div>
                                <div class="text-xs font-mono text-[#3fb950]">+1.12%</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Market Status -->
                <div class="p-3">
                    <div class="flex items-center gap-2 text-xs">
                        <div class="w-2 h-2 rounded-full bg-[#3fb950] animate-pulse"></div>
                        <span class="text-[#8b949e]">Market Open</span>
                    </div>
                    <div class="mt-2 text-xs text-[#8b949e]">
                        <div class="flex justify-between py-1">
                            <span>Volume</span>
                            <span class="font-mono text-[#c9d1d9]">1.24M</span>
                        </div>
                        <div class="flex justify-between py-1">
                            <span>High</span>
                            <span class="font-mono text-[#3fb950]">45,892.00</span>
                        </div>
                        <div class="flex justify-between py-1">
                            <span>Low</span>
                            <span class="font-mono text-[#f85149]">44,921.25</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
        
        <!-- ===== BOTTOM STATUS BAR ===== -->
        <footer class="bg-[#161b22] border-t border-[#30363d] flex items-center px-4 gap-4 text-xs">
            <div class="flex items-center gap-2">
                <div class="w-1.5 h-1.5 rounded-full bg-[#3fb950]"></div>
                <span class="text-[#8b949e]">Connected</span>
            </div>
            <div class="w-px h-3 bg-[#30363d]"></div>
            <span class="text-[#8b949e]">Latency: <span class="text-[#c9d1d9] font-mono">12ms</span></span>
            <div class="w-px h-3 bg-[#30363d]"></div>
            <span class="text-[#8b949e]">Symbol: <span class="text-[#c9d1d9] font-mono" id="statusSymbol">BTCUSD</span></span>
            <div class="w-px h-3 bg-[#30363d]"></div>
            <span class="text-[#8b949e]">Timeframe: <span class="text-[#c9d1d9] font-mono" id="statusTimeframe">4H</span></span>
            <div class="flex-1"></div>
            <span class="text-[#8b949e] font-mono" id="statusTime">--:--:--</span>
        </footer>
    </div>
    
    <!-- Scripts -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
